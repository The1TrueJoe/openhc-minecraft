# Xorg on the panel: modesetting on the boot framebuffer (simpledrm, card0),
# rendering with glamor on the SGX545 through Mesa. No input devices: mc-inputd
# delivers keyboards, mice and pads through XTest.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoEnableDevices" "false"
	Option "AllowEmptyInput" "true"
EndSection

Section "Device"
	Identifier "panel"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
EndSection
