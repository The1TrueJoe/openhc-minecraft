name: build

# Two artifacts, attached to a release when one is published:
#   runtime-i386.tar.xz        the i386 game runtime (Debian + Xvfb + gl4es + Java 8)
#   openhc-minecraft-ea.tar.gz what goes on the box itself, rooted at /
#                              (mc-inputd, mc-fetch, mc-session, mc-install, S96minecraft)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends debootstrap xz-utils
      - name: Build the i386 runtime
        run: sudo ./runtime/build-runtime.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-i386
          path: out/runtime-i386.tar.xz
          if-no-files-found: error

  box:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust (x86_64 musl) + a musl C compiler for ring
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build mc-inputd + mc-fetch
        working-directory: inputd
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package the box side
        run: |
          set -e
          P=stage
          install -d $P/opt/minecraft/bin $P/etc/init.d
          install -m 0755 inputd/target/x86_64-unknown-linux-musl/release/mc-inputd \
                          inputd/target/x86_64-unknown-linux-musl/release/mc-fetch \
                          box/bin/* $P/opt/minecraft/bin/
          install -m 0755 box/init.d/S96minecraft $P/etc/init.d/
          tar -C $P --owner=0 --group=0 -czf openhc-minecraft-ea.tar.gz .
          tar -tzvf openhc-minecraft-ea.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: openhc-minecraft-ea
          path: openhc-minecraft-ea.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [runtime, box]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
