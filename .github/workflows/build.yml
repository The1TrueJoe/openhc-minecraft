name: build

# Two artifacts, attached to a release when one is published:
#   runtime-amd64.tar.xz       the game runtime (Debian + Xorg + Mesa for the SGX545 + Java 8)
#   openhc-minecraft-ea.tar.gz what goes on the box itself, rooted at /
#                              (mc-inputd, mc-fetch, mc-session, mc-install, S96minecraft)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends debootstrap xz-utils
      - name: Build the runtime
        run: sudo ./runtime/build-runtime.sh out
      - name: Smoke-test the recorder's ffmpeg
        # mc-record's video path without a GPU: 2 s of raw I420 through a FIFO,
        # encoded with mc-record's settings by the runtime's own ffmpeg.
        run: |
          set -e
          R=out/root
          sudo mkdir -p $R/tmp/rec
          sudo mkfifo $R/tmp/rec/video
          sudo chroot $R /usr/local/bin/ffmpeg -nostdin -hide_banner -loglevel warning -y \
            -f rawvideo -pix_fmt yuv420p -video_size 720x480 -framerate 30 \
            -use_wallclock_as_timestamps 1 -thread_queue_size 64 -i /tmp/rec/video \
            -map 0:v -fps_mode cfr -r 30 \
            -c:v libx264 -preset ultrafast -crf 23 -g 60 -pix_fmt yuv420p \
            -color_range tv -colorspace smpte170m -color_primaries smpte170m -color_trc smpte170m \
            -shortest -movflags +frag_keyframe+empty_moov+default_base_moof /tmp/rec/out.mp4 &
          ff=$!
          for i in $(seq 60); do head -c 518400 /dev/urandom; sleep 0.033; done | sudo tee $R/tmp/rec/video >/dev/null
          wait $ff
          ls -l $R/tmp/rec/out.mp4
          test "$(sudo stat -c %s $R/tmp/rec/out.mp4)" -gt 100000
          sudo chroot $R /usr/local/bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libx264|aac"
          sudo chroot $R /usr/local/bin/mc-gpucheck || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-amd64
          path: out/runtime-amd64.tar.xz
          if-no-files-found: error

  box:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust (x86_64 musl) + a musl C compiler for ring
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build mc-inputd + mc-fetch
        working-directory: inputd
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package the box side
        run: |
          set -e
          P=stage
          install -d $P/opt/minecraft/bin $P/etc/init.d
          install -m 0755 inputd/target/x86_64-unknown-linux-musl/release/mc-inputd \
                          inputd/target/x86_64-unknown-linux-musl/release/mc-fetch \
                          box/bin/* $P/opt/minecraft/bin/
          install -m 0755 box/init.d/S96minecraft $P/etc/init.d/
          tar -C $P --owner=0 --group=0 -czf openhc-minecraft-ea.tar.gz .
          tar -tzvf openhc-minecraft-ea.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: openhc-minecraft-ea
          path: openhc-minecraft-ea.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: [runtime, box]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
